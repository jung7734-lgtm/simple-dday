<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f8">
  <meta name="description" content="간단하고 깔끔한 D-Day 날짜 카운터">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>D-Day</title>
  <style>
:root{color-scheme:light;--purple:#9364ad;--deep:#79518f;--pink:#ec83a6;--ink:#51424e;--muted:#8d8190;--line:#eadcf0}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#eee2f7,#fff3f7 54%,#ead8f4)}
main{max-width:560px;min-height:100dvh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;margin:5px 6px 10px}h1{margin:0;font-size:clamp(39px,10vw,54px);letter-spacing:-2px;color:var(--deep);font-weight:900;text-shadow:1px 2px #fff}
button{font:inherit;cursor:pointer}.menu-mark{font-size:25px;color:var(--purple)}.add-btn{width:46px;height:46px;border:0;border-radius:50%;background:var(--purple);color:white;font-size:30px;line-height:1;box-shadow:0 3px 0 #754b8d}
.cheer-line{text-align:center;color:var(--deep);background:#fffaffd9;border:2px dashed #d6bde6;border-radius:28px;padding:11px 8px;margin:10px 5px 14px;font-size:clamp(14px,3.6vw,17px);font-weight:850}
.featured{background:#fffdfd;border:2px solid #dfc7ec;border-radius:30px;padding:20px 13px 15px;text-align:center;box-shadow:0 7px 22px #78518a12}
.symbol{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 8px;color:var(--purple);font-size:42px}.featured h2{font-size:clamp(22px,5.8vw,29px);margin:0 0 7px;font-weight:850;color:#51424e}
.date{color:var(--muted);font-size:14px}.count-label{color:var(--pink);font-size:15px;font-weight:800;margin-top:18px}.count{color:var(--purple);font-size:clamp(66px,18vw,88px);font-weight:900;line-height:1.05;letter-spacing:-3px;margin:3px 0 7px}
.count-row{display:flex;justify-content:center;align-items:center;gap:9px}.family-icon{font-size:27px}.ribbon{color:#c3a0d7;font-size:20px;margin:10px auto 0;letter-spacing:4px}
.character-panel{margin:13px 0 0;padding:10px;background:#e7d7f1;border:1px solid #d8c1e7;border-radius:25px;overflow:hidden}.character-panel img{display:block;width:min(100%,360px);height:auto;margin:0 auto;border-radius:18px}
.character-caption{text-align:center;color:#805b99;font-weight:850;font-size:15px;margin:10px 0 3px}.bunny-row{display:flex;justify-content:center;align-items:center;gap:9px;color:#9275a6;font-size:13px;font-weight:750;margin:9px 0 15px}.bunny-row .bunny{font-size:24px}
.section-label{font-size:14px;color:#9c8ca5;margin:0 4px 9px}.list{overflow:hidden;background:#fffdfd;border:1px solid #e5d7ec;border-radius:22px}.event{display:flex;align-items:center;gap:11px;padding:15px 12px}.event+.event{border-top:1px solid var(--line)}
.event-icon{flex:0 0 42px;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#f3e9f8;color:var(--purple);font-size:22px}.event-main{min-width:0;flex:1}.event-title{font-size:16px;font-weight:750;overflow-wrap:anywhere}.event-date{color:var(--muted);font-size:13px;margin-top:4px}
.event-count{color:var(--pink);font-size:19px;font-weight:850;white-space:nowrap}.empty{padding:24px 15px;color:var(--muted);text-align:center;font-size:14px}
.nav-preview{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;background:#fffdfd;border:1px solid #e5d7ec;border-radius:22px;padding:12px 2px 10px;text-align:center}.nav-item{color:#89778f;font-size:11px;font-weight:750;padding:3px 0}.nav-item span{display:block;font-size:24px;margin-bottom:5px}.nav-button{font-family:inherit;border:0;background:transparent;width:100%;border-radius:14px}.nav-button:active{background:#f3e9f8;transform:scale(.98)}.cheer-message{font-size:17px;line-height:1.8;text-align:center;color:var(--deep);font-weight:750;padding:8px 2px 14px}.cheer-heart{text-align:center;font-size:32px;margin-bottom:10px}.note{color:#9b8ca2;font-size:12px;text-align:center;margin:13px 8px 0}
dialog{border:0;border-radius:22px;padding:23px;width:calc(100% - 36px);max-width:420px;box-shadow:0 18px 70px #0003;color:var(--ink)}dialog::backdrop{background:#16162166;backdrop-filter:blur(3px)}dialog h2{margin:0 0 18px;font-size:21px}
label{display:block;font-size:13px;color:#756b79;margin:13px 0 7px}input{width:100%;border:1px solid #e1d4e7;border-radius:12px;padding:13px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.dialog-actions{display:flex;gap:10px;margin-top:22px}.dialog-actions button{flex:1;padding:13px;border-radius:12px;border:0;font-weight:700}.cancel{background:#f4edf7;color:#65596b}.save{background:var(--purple);color:white}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#59465f;color:white;border-radius:30px;padding:11px 17px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
</style>
</head>

  <script>
    const STORAGE_KEY = "simple-dday-events-v1";
    const today = () => {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    };
    const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
    const dayDiff = dateString => Math.round((parseDate(dateString) - today()) / 86400000);
    const dateLabel = s => {
      const d = parseDate(s);
      const weekdays = ["일","월","화","수","목","금","토"];
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} (${weekdays[d.getDay()]})`;
    };
    const countLabel = n => n > 0 ? `D-${n}` : n === 0 ? "D-Day" : `D+${Math.abs(n)}`;
    const iconFor = name => /수능|시험|졸업|입학/.test(name) ? "🎓" : /여행|휴가/.test(name) ? "✈️" : /생일/.test(name) ? "♥" : "📅";
    let events;
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      events = saved ? JSON.parse(saved) : [{ id:"suhui-exam-2026", name:"수능 : 정서희", date:"2026-11-19" }];
      if (!Array.isArray(events)) events = [];
    } catch { events = [{ id:"suhui-exam-2026", name:"수능 : 정서희", date:"2026-11-19" }]; }
    const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    const sortedEvents = () => [...events].sort((a,b) => dayDiff(a.date)-dayDiff(b.date) || a.date.localeCompare(b.date));

      if (!sorted.length) {

      } else {

          const n = dayDiff(e.date);
          return `<div class="event"><div class="event-icon">${iconFor(e.name)}</div><div class="event-main"><div class="event-title">${escapeHtml(e.name)}</div><div class="event-date">${dateLabel(e.date)}</div></div><div class="event-count">${countLabel(n)}</div></div>`;

    }
    function escapeHtml(value) {

    // 2026-09-30부터 날짜별로 메시지를 하나씩 보여 줘. 수능일까지 반복되지 않아.
    const cheerStartDate = new Date(2026, 8, 30);
    const dayIndex = Math.max(0, Math.floor((today() - cheerStartDate) / 86400000)) % cheerMessages.length;
    const cheerDialog = document.getElementById("cheerDialog");
    document.getElementById("openCheer").addEventListener("click", () => {
      document.getElementById("cheerMessage").textContent = cheerMessages[dayIndex];
      cheerDialog.showModal();
    });
    document.getElementById("closeCheer").addEventListener("click", () => cheerDialog.close());

    const dialog = document.getElementById("addDialog");
    document.getElementById("openAdd").addEventListener("click", () => {
      document.getElementById("eventDate").value = "";
      dialog.showModal();
      document.getElementById("eventName").focus();
    });
    document.getElementById("cancelAdd").addEventListener("click", () => dialog.close());
    document.getElementById("eventForm").addEventListener("submit", e => {
      e.preventDefault();
      const name = document.getElementById("eventName").value.trim();
      const date = document.getElementById("eventDate").value;
      if (!name || !date) return;
      events.push({ id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), name, date });
      save(); render(); dialog.close(); e.target.reset(); showToast("D-Day를 추가했어요.");
    });
    let toastTimer;
    function showToast(message) {
      const el = document.getElementById("toast");
      el.textContent = message; el.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
    }
    render();
    // 앱이 자정 이후 다시 활성화되면 날짜를 다시 계산합니다.
    document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
