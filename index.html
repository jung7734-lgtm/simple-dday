<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f8">
  <meta name="description" content="간단하고 깔끔한 D-Day 날짜 카운터">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>D-Day</title>
  <style>
    :root { color-scheme: light; --pink:#ed7890; --pink-light:#fff0f3; --ink:#54372f; --muted:#a18c87; --line:#f4dfe2; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(180deg,#fff4f3 0%,#fffaf7 48%,#fff6f8 100%); color:var(--ink); font-family:"Arial Rounded MT Bold","Trebuchet MS","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    main { max-width:560px; min-height:100dvh; margin:0 auto; padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; margin:10px 2px 12px; }
    h1 { font-size:32px; letter-spacing:-1.2px; margin:0; color:#69453b; }
    .cheer { text-align:center; color:#80584d; font-size:15px; line-height:1.8; font-weight:700; margin:8px 8px 24px; }
    .cheer .heart { color:var(--pink); font-size:18px; }
    .sparkle { color:#efb94e; }
    button { font:inherit; cursor:pointer; }
    .add-btn { width:46px; height:46px; border:0; border-radius:50%; background:white; color:var(--pink); font-size:30px; line-height:1; box-shadow:0 3px 14px #2525450d; }
    .section-label { font-size:14px; color:var(--muted); margin:0 4px 12px; }
    .featured { background:#fffaf5; border:2px solid #f7dfe1; border-radius:28px; padding:28px 20px 24px; text-align:center; box-shadow:0 7px 0 #f8e7e7, 0 10px 24px #9b68600d; margin-bottom:30px; position:relative; overflow:hidden; }
    .symbol { display:grid; place-items:center; width:58px; height:58px; border-radius:22px; background:#ffe9ee; color:var(--pink); font-size:27px; margin:8px auto 14px; border:1px solid #f8d2dc; }
    .featured h2 { font-size:21px; margin:0 0 8px; font-weight:650; }
    .date { color:var(--muted); font-size:14px; }
    .count-label { color:var(--pink); font-size:17px; font-weight:650; margin-top:26px; }
    .count { color:var(--pink); font-size:76px; font-weight:750; line-height:1.1; letter-spacing:-3px; margin:4px 0 14px; }
    .list { overflow:hidden; background:#fffdfa; border:1.5px solid #f4dfe2; border-radius:22px; box-shadow:0 5px 0 #f8e9e9; }
    .event { display:flex; align-items:center; gap:13px; padding:17px 15px; }
    .event + .event { border-top:1px solid var(--line); }
    .event-icon { flex:0 0 46px; width:46px; height:46px; display:grid; place-items:center; border-radius:17px; background:var(--pink-light); color:var(--pink); font-size:22px; border:1px solid #f8e0e5; }
    .event-main { min-width:0; flex:1; }
    .event-title { font-size:16px; font-weight:650; overflow-wrap:anywhere; }
    .event-date { color:var(--muted); font-size:13px; margin-top:5px; }
    .event-count { color:var(--pink); font-size:20px; font-weight:650; white-space:nowrap; }
    .delete-btn { border:0; background:transparent; color:#a0a2a8; font-size:22px; padding:5px 0 5px 5px; }
    .empty { padding:28px 18px; color:var(--muted); text-align:center; font-size:14px; }
    .note { color:#a1847d; font-size:13px; line-height:1.8; text-align:center; margin:20px 8px 0; }
    .family-message { text-align:center; color:#9b6b60; font-size:13px; line-height:1.8; margin:18px 4px 0; }
    .family-message strong { color:#e8758b; }
    dialog { border:0; border-radius:22px; padding:24px; width:calc(100% - 36px); max-width:420px; box-shadow:0 18px 70px #0003; }
    dialog::backdrop { background:#16162166; backdrop-filter:blur(3px); }
    dialog h2 { margin:0 0 20px; font-size:21px; }
    label { display:block; font-size:13px; color:#656872; margin:14px 0 7px; }
    input { width:100%; border:1px solid #dedfe5; border-radius:12px; padding:13px 12px; font:inherit; font-size:16px; background:#fff; color:var(--ink); }
    .dialog-actions { display:flex; gap:10px; margin-top:24px; }
    .dialog-actions button { flex:1; padding:13px; border-radius:12px; border:0; font-weight:650; }
    .cancel { background:#f1f1f5; color:#555963; }
    .save { background:var(--pink); color:white; }
    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#27272d; color:white; border-radius:30px; padding:11px 17px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; }
    .toast.show { opacity:1; }
    @media (min-width:520px) { main { padding-top:36px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>D-Day</h1>
      <button class="add-btn" id="openAdd" aria-label="날짜 추가">+</button>
    </header>
    <p class="cheer"><span class="heart">♡</span> 아빠 엄마 준영이가 항상 응원한다 <span class="heart">♡</span><br><span class="sparkle">✦</span> 서희야, 너의 노력이 꼭 빛날 거야! <span class="sparkle">✦</span></p>
    <p class="section-label">♡ 가장 가까운 D-Day</p>
    <section id="featured" class="featured" aria-live="polite"></section>
    <p class="section-label">♡ 내 D-Day</p>
    <section id="eventList" class="list" aria-live="polite"></section>
    <p class="family-message">오늘도 수고했어, 서희야! <strong>너의 노력은 빛나는 날이 꼭 올 거야</strong> ✨</p>
    <p class="note">날짜는 이 기기에 저장돼요. 언제나 가족이 응원하고 있어 ♡</p>
  </main>

  <dialog id="addDialog">
    <form id="eventForm">
      <h2>새 D-Day 추가</h2>
      <label for="eventName">이름</label>
      <input id="eventName" name="eventName" maxlength="50" placeholder="예: 가족 여행" required>
      <label for="eventDate">목표 날짜</label>
      <input id="eventDate" name="eventDate" type="date" required>
      <div class="dialog-actions">
        <button type="button" class="cancel" id="cancelAdd">취소</button>
        <button type="submit" class="save">추가하기</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const STORAGE_KEY = "simple-dday-events-v1";
    const today = () => {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    };
    const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
    const dayDiff = dateString => Math.round((parseDate(dateString) - today()) / 86400000);
    const dateLabel = s => {
      const d = parseDate(s);
      const weekdays = ["일","월","화","수","목","금","토"];
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} (${weekdays[d.getDay()]})`;
    };
    const countLabel = n => n > 0 ? `D-${n}` : n === 0 ? "D-Day" : `D+${Math.abs(n)}`;
    const iconFor = name => /수능|시험|졸업|입학/.test(name) ? "🎓" : /여행|휴가/.test(name) ? "✈️" : /생일/.test(name) ? "🎂" : /기념일/.test(name) ? "💝" : "🌷";
    let events;
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      events = saved ? JSON.parse(saved) : [{ id:"suhui-exam-2026", name:"수능 : 정서희", date:"2026-11-19" }];
      if (!Array.isArray(events)) events = [];
    } catch { events = [{ id:"suhui-exam-2026", name:"수능 : 정서희", date:"2026-11-19" }]; }
    const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    const sortedEvents = () => [...events].sort((a,b) => dayDiff(a.date)-dayDiff(b.date) || a.date.localeCompare(b.date));
    const featured = document.getElementById("featured");
    const list = document.getElementById("eventList");
    function render() {
      const sorted = sortedEvents();
      if (sorted.length) {
        const e = sorted[0], n = dayDiff(e.date);
        featured.innerHTML = `<div class="symbol">${iconFor(e.name)}</div><h2>${escapeHtml(e.name)}</h2><div class="date">${dateLabel(e.date)}</div><div class="count-label">${n > 0 ? "목표일까지" : n === 0 ? "오늘은" : "지난 날짜"}</div><div class="count">${countLabel(n)}</div><div class="date">${n > 0 ? `${n}일 남았어요` : n === 0 ? "오늘이 목표일이에요" : `${Math.abs(n)}일 지났어요`}</div>`;
      } else {
        featured.innerHTML = `<div class="symbol">＋</div><h2>D-Day를 추가해 보세요</h2><div class="date">중요한 날짜를 간단하게 관리할 수 있어요.</div>`;
      }
      if (!sorted.length) {
        list.innerHTML = `<div class="empty">등록된 날짜가 없어요.</div>`;
      } else {
        list.innerHTML = sorted.map(e => {
          const n = dayDiff(e.date);
          return `<div class="event"><div class="event-icon">${iconFor(e.name)}</div><div class="event-main"><div class="event-title">${escapeHtml(e.name)}</div><div class="event-date">${dateLabel(e.date)}</div></div><div class="event-count">${countLabel(n)}</div><button class="delete-btn" data-delete="${escapeHtml(e.id)}" aria-label="${escapeHtml(e.name)} 삭제" title="삭제">×</button></div>`;
        }).join("");
      }
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }
    const dialog = document.getElementById("addDialog");
    document.getElementById("openAdd").addEventListener("click", () => {
      document.getElementById("eventDate").value = "";
      dialog.showModal();
      document.getElementById("eventName").focus();
    });
    document.getElementById("cancelAdd").addEventListener("click", () => dialog.close());
    document.getElementById("eventForm").addEventListener("submit", e => {
      e.preventDefault();
      const name = document.getElementById("eventName").value.trim();
      const date = document.getElementById("eventDate").value;
      if (!name || !date) return;
      events.push({ id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), name, date });
      save(); render(); dialog.close(); e.target.reset(); showToast("D-Day를 추가했어요.");
    });
    list.addEventListener("click", e => {
      const btn = e.target.closest("[data-delete]");
      if (!btn) return;
      const target = events.find(x => x.id === btn.dataset.delete);
      if (!target) return;
      if (!confirm(`'${target.name}' D-Day를 삭제할까요?`)) return;
      events = events.filter(x => x.id !== target.id);
      save(); render(); showToast("삭제했어요.");
    });
    let toastTimer;
    function showToast(message) {
      const el = document.getElementById("toast");
      el.textContent = message; el.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
    }
    render();
    // 앱이 자정 이후 다시 활성화되면 날짜를 다시 계산합니다.
    document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
