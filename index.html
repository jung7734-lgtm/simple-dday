<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>D-Day</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      --pink-main: #e85d75;
      --pink-light: #ffdce1;
      --bg-top: #ffeaef;
      --bg-bottom: #e5f0d8;
      --text-dark: #4a3b38;
      --text-gray: #8e807d;
      --white-card: rgba(255, 255, 255, 0.95);
    }
    
    body {
      margin: 0; padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, #fff4f5 50%, var(--bg-bottom) 100%);
      color: var(--text-dark);
      height: 100vh; overflow: hidden;
      display: flex; justify-content: center;
    }

    .app-container {
      width: 100%; max-width: 430px; height: 100%;
      display: flex; flex-direction: column; position: relative;
      box-shadow: 0 0 30px rgba(232, 93, 117, 0.15);
      background-image: 
        radial-gradient(circle at 10% 20%, #fff 0 4px, transparent 5px),
        radial-gradient(circle at 90% 40%, #ffc0cb 0 4px, transparent 5px);
    }

    /* 상단 헤더 */
    header {
      display: flex; justify-content: space-between; align-items: center; 
      padding: 20px 20px 10px; padding-top: max(20px, env(safe-area-inset-top));
    }
    .menu-btn { background: none; border: none; font-size: 28px; color: var(--pink-main); cursor: pointer; }
    .add-btn {
      background: var(--pink-main); color: white; border: none; border-radius: 50%;
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      font-size: 24px; line-height: 1; padding-bottom: 3px; cursor: pointer;
    }
    .logo { font-size: 42px; font-weight: 900; color: var(--pink-main); margin: 0; letter-spacing: -1.5px; }

    /* 응원 문구 (알약 모양) */
    .cheer-pill {
      margin: 5px auto 20px; background: rgba(255,255,255,0.7);
      border: 1.5px solid var(--pink-light); border-radius: 20px;
      padding: 8px 24px; font-size: 13px; font-weight: 800; color: var(--text-dark);
      display: inline-flex; align-items: center; justify-content: center; gap: 5px; align-self: center;
    }

    /* 메인 카드 */
    .main-card {
      background: var(--white-card); border-radius: 30px; margin: 0 25px;
      padding: 30px 20px; text-align: center;
      box-shadow: 0 10px 25px rgba(232, 93, 117, 0.08);
      position: relative; z-index: 10;
    }
    .cap-icon { font-size: 40px; margin-bottom: 5px; line-height: 1; }
    .card-title { font-size: 26px; font-weight: 800; margin: 0 0 8px; color: #3d2f2b; }
    .card-date { font-size: 14px; color: var(--text-gray); margin: 0 0 15px; }
    
    .divider-wrap { position: relative; margin: 20px 0; text-align: center; }
    .divider-line { border-top: 2px dashed #f4d9d3; position: absolute; top: 50%; width: 100%; z-index: 1; }
    .divider-icon { position: relative; z-index: 2; background: var(--white-card); padding: 0 10px; color: #f08ea0; font-size: 20px; }

    .d-day-count { font-size: 68px; font-weight: 900; color: var(--pink-main); margin: 0 0 5px; letter-spacing: -2px; }
    .base-date { font-size: 12px; color: var(--text-gray); margin-bottom: 20px; }
    .family-emoji { font-size: 55px; line-height: 1; }

    /* 중간 배경 (토끼와 소녀) */
    .scene {
      flex: 1; position: relative; display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 30px 100px;
    }
    .bunny-wrap { position: relative; text-align: center; }
    .bunny { font-size: 65px; line-height: 1; }
    .cheer-sign {
      background: #fffaf5; border: 2px solid #eea1a5; border-radius: 8px;
      padding: 4px 8px; color: #d76577; font-size: 12px; font-weight: 800;
      position: absolute; bottom: 15px; left: 45px; transform: rotate(-5deg);
      white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .girl { font-size: 75px; line-height: 1; margin-bottom: 15px; transform: scaleX(-1); }

    /* 하단 네비게이션 바 */
    .bottom-nav-wrap {
      position: absolute; bottom: 35px; left: 20px; right: 20px; z-index: 20;
    }
    .bottom-nav {
      background: rgba(255,255,255,0.95); border-radius: 20px;
      display: flex; justify-content: space-around; padding: 15px 5px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      color: var(--text-gray); font-size: 11px; font-weight: bold; width: 60px; text-align: center;
    }
    .nav-icon {
      font-size: 22px; background: #fff0f2; width: 44px; height: 44px;
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      color: var(--pink-main); box-shadow: inset 0 0 0 1px #fbe3e6;
    }

    /* 하단 플로팅 버튼 (편집, 공유) */
    .floating-btn {
      position: absolute; bottom: -5px; width: 44px; height: 44px;
      border-radius: 50%; background: #a89a98; color: white; border: none;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15); z-index: 30;
    }
    .btn-edit { left: -5px; }
    .btn-share { right: -5px; font-size: 20px; }
    
    .bottom-text {
      position: absolute; bottom: 10px; width: 100%; text-align: center;
      font-size: 12px; color: #a89a98; font-weight: 600; letter-spacing: -0.5px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <header>
      <button class="menu-btn">≡</button>
      <h1 class="logo">D-Day</h1>
      <button class="add-btn">+</button>
    </header>

    <div class="cheer-pill">
      <span style="color:var(--pink-main)">♥</span> 아빠 엄마 준영이가 항상 응원한다 <span style="color:var(--pink-main)">♥</span>
    </div>

    <div class="main-card">
      <div class="cap-icon">🎓</div>
      <h2 class="card-title">수능 : 정서희</h2>
      <p class="card-date">2026년 11월 19일 (목)</p>
      
      <div class="divider-wrap">
        <div class="divider-line"></div>
        <span class="divider-icon">🎀</span>
      </div>

      <h1 class="d-day-count" id="dday-count">D-Day</h1>
      <p class="base-date" id="today-date">기준일 계산중...</p>
      
      <div class="family-emoji">👨‍👩‍👦</div>
      <div style="font-size:12px; color:var(--text-gray); margin-top:8px; font-weight:bold;">서희의 꿈을 응원해 ♡</div>
    </div>

    <div class="scene">
      <div class="bunny-wrap">
        <div class="bunny">🐰</div>
        <div class="cheer-sign">화이팅! ♥</div>
      </div>
      <div class="girl">👧🏻</div>
    </div>

    <div class="bottom-nav-wrap">
      <div class="bottom-nav">
        <div class="nav-item"><div class="nav-icon">📅</div>전체 일정</div>
        <div class="nav-item"><div class="nav-icon">📔</div>오늘의 응원</div>
        <div class="nav-item"><div class="nav-icon">🖼️</div>추억 앨범</div>
        <div class="nav-item"><div class="nav-icon">⚙️</div>설정</div>
      </div>
      <button class="floating-btn btn-edit">편집</button>
      <button class="floating-btn btn-share">↑</button>
    </div>

    <div class="bottom-text">서희의 꿈을 응원해 ♡</div>

  </div>

  <script>
    // D-Day 자동 계산 로직
    function calculateDday() {
      const targetDate = new Date('2026-11-19T00:00:00');
      const today = new Date();
      
      // 오늘 날짜 텍스트 세팅
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      const days = ['일','월','화','수','목','금','토'];
      const dayStr = days[today.getDay()];
      document.getElementById('today-date').innerText = `${y}.${m}.${d} (${dayStr}) 기준`;

      // D-Day 계산
      const todayStart = new Date(y, today.getMonth(), today.getDate());
      const diffTime = targetDate.getTime() - todayStart.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      const ddayElement = document.getElementById('dday-count');
      if (diffDays > 0) {
        ddayElement.innerText = 'D-' + diffDays;
      } else if (diffDays === 0) {
        ddayElement.innerText = 'D-Day';
      } else {
        ddayElement.innerText = 'D+' + Math.abs(diffDays);
      }
    }

    // 스크립트 실행
    calculateDday();

    // 서비스 워커 등록 (PWA 유지용)
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
